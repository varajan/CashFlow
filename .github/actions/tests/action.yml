inputs:
  project:
    required: true
    type: string
  test-name:
    required: true
    type: string
  artifact-path:
    required: true
    type: string
  artifact-name:
    required: true
    type: string

runs:
  using: "composite"
  steps:
    - name: Setup .NET SDK 8.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - uses: actions/download-artifact@v4
      with:
        name: build
        path: ./

    - name: Run Tests (${{ inputs.test-name }})
      shell: bash
      run: |
        dotnet test ${{ inputs.project }} \
          --configuration Release \
          --no-build \
          --verbosity quiet \
          --logger "html;LogFileName=${{ inputs.test-name }}.html"

    - name: Upload logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.artifact-path }}
        retention-days: 7