name: System Test

on:
  workflow_call:

jobs:

  build:
    uses: ./.github/workflows/build.yml

  unit-tests:
    needs: build
    uses: ./.github/workflows/unit.yml

  system-tests:
    needs: unit-tests
    uses: ./.github/workflows/system.yml

  build:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup .NET SDK 8.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/download-artifact@v4
        with:
          name: build
          path: out

      - name: Run System Tests
        run: dotnet test CashFlowBotSystemTests/CashFlowBotSystemTests.csproj --configuration Release --no-build --verbosity quiet --logger "html;LogFileName=SystemTests.html"

      - name: Upload logs and messages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-tests
          path: |
            CashFlowBotSystemTests/TestResults/
            emulator/
          retention-days: 7

