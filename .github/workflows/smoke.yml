on:
  workflow_call:

jobs:
  win:
    name: Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/smoke
        with:
          bot_token: ${{ secrets.WIN_BOT_TOKEN }}
          bot_name: ${{ secrets.WIN_BOT_NAME }}
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          phone_number: ${{ secrets.PHONE_NUMBER }}
          testing_session: ${{ secrets.TESTING_SESSION }}

  linux:
    name: Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/smoke
        with:
          bot_token: ${{ secrets.LNX_BOT_TOKEN }}
          bot_name: ${{ secrets.LNX_BOT_NAME }}
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          phone_number: ${{ secrets.PHONE_NUMBER }}
          testing_session: ${{ secrets.TESTING_SESSION }}

  macos:
    name: MacOs
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/smoke
        with:
          bot_token: ${{ secrets.MAC_BOT_TOKEN }}
          bot_name: ${{ secrets.MAC_BOT_NAME }}
          api_id: ${{ secrets.API_ID }}
          api_hash: ${{ secrets.API_HASH }}
          phone_number: ${{ secrets.PHONE_NUMBER }}
          testing_session: ${{ secrets.TESTING_SESSION }}
