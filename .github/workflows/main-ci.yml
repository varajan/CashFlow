name: Build and Test (.NET 8)

on: pull_request

jobs:
  build:
    uses: ./.github/workflows/build.yml

  tests:
    name: Test
    needs: build
    uses: ./.github/workflows/tests.yml

  smoke:
    if: ${{ !github.event.pull_request.draft }}
    name: Smoke
    needs: tests
    uses: ./.github/workflows/smoke.yml
    secrets: inherit
