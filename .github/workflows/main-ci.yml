name: Build and Test (.NET 8)

on: pull_request

jobs:
  build:
    uses: ./.github/workflows/build.yml

  unit-tests:
    needs: build
    uses: ./.github/workflows/unit.yml

  system-tests:
    needs: unit-tests
    uses: ./.github/workflows/system.yml

