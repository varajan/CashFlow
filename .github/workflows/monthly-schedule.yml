name: Monthly Scheduled Run

on:
  schedule:
    - cron: '0 0 1 * *'
  
  workflow_dispatch:

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml

  test:
    name: Test
    needs: build
    uses: ./.github/workflows/tests.yml

  smoke:
    if: ${{ !github.event.pull_request.draft }}
    name: Smoke
    needs: test
    uses: ./.github/workflows/smoke.yml
    secrets: inherit
